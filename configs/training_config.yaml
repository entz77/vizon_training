# YOLO Training Configuration

# Model settings
model_type: 'rfdetr'  # Backend: yolo | rfdetr
model_size: 'base'     # yolo: n, s, m, l, x | rfdetr: nano, small, medium, base, large

# Extra backend-specific args passed straight to the model's train() (optional)
train_args:
  grad_accum_steps: 8   # rfdetr: effective batch = batch_size x this
#   lr: 0.0001          # rfdetr

# Training parameters
epochs: 120
batch_size: 4
imgsz: 640
patience: 20
single_cls: false  # Treat all classes as a single class

# Learning rate parameters
lr0: 0.01      # Initial learning rate
lrf: 0.01      # Final learning rate ratio

# Optimizer parameters
# momentum: 0.937
# weight_decay: 0.0005
# warmup_epochs: 3

# # Data augmentation
# hsv_h: 0.015   # HSV-Hue augmentation
# hsv_s: 0.7     # HSV-Saturation augmentation
# hsv_v: 0.4     # HSV-Value augmentation
# degrees: 0.0   # Rotation augmentation
# translate: 0.1 # Translation augmentation
# scale: 0.5     # Scale augmentation
# flipud: 0.0    # Flip upside-down probability
# fliplr: 0.5    # Flip left-right probability
# mosaic: 1.0    # Mosaic augmentation

# Device and logging
device: null   # null for auto-detect (GPU if available, else CPU)
verbose: false
save_period: 10

# Directories
data_dir: datasets
log_dir: logs
output_dir: train  # Ultralytics will auto-increment: train, train1, train2, etc. in runs/ folder

